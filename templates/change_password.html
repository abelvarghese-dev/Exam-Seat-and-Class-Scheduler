{% extends "base.html" %}
{% block content %}
<style>
    .edit-container { max-width: 500px; margin: 40px auto; background: #fff; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #475569; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; color: #1e293b; box-sizing: border-box; transition: 0.3s; }
    .form-group input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); }
    .btn-password { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1.05rem; cursor: pointer; width: 100%; margin-top: 15px; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.2); transition: 0.3s; }
    .btn-password:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3); }
    .pass-hint { font-size: 0.75rem; color: #64748b; margin-top: 5px; line-height: 1.4; }
</style>

<div class="edit-container">
    <h2 style="color: #0f172a; margin-top: 0; margin-bottom: 30px; text-align: center;">
        <i class="fas fa-lock" style="color: #f59e0b; margin-right: 8px;"></i> Change Password
    </h2>

    <form action="/admin/update_password" method="POST" onsubmit="return validatePasswords(event)">
        <div class="form-group">
            <label><i class="fas fa-key" style="color: #94a3b8; margin-right: 5px;"></i> Current Password</label>
            <input type="password" name="current_password" placeholder="Enter current password" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-unlock-alt" style="color: #94a3b8; margin-right: 5px;"></i> New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
            <p class="pass-hint">Min 6 chars, 1 Capital, 1 Number, 1 Symbol (@$!%*?&)</p>
        </div>

        <div class="form-group">
            <label><i class="fas fa-shield-alt" style="color: #94a3b8; margin-right: 5px;"></i> Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_new_password" placeholder="Confirm new password" required>
        </div>

        <button type="submit" class="btn-password">
            <i class="fas fa-sync-alt" style="margin-right: 8px;"></i> Update Password
        </button>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="/admin/profile" style="color: #64748b; text-decoration: none; font-size: 0.9rem;">Cancel and Go Back</a>
        </div>
    </form>
</div>

<script>
    function validatePasswords(event) {
        const newPass = document.getElementById('new_password').value;
        const confirmPass = document.getElementById('confirm_password').value;

        // 1. സ്ട്രോങ്ങ്‌ പാസ്‌വേഡ് ചെക്ക് (Regex)
        // Min 6 chars, 1 Upper, 1 Number, 1 Special Char
        const passRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6,}$/;

        if (!passRegex.test(newPass)) {
            alert("Password Requirements:\n- Minimum 6 characters\n- At least 1 Uppercase letter (A-Z)\n- At least 1 Number (0-9)\n- At least 1 Symbol (@$!%*?&)");
            return false;
        }

        // 2. മാച്ചിങ് ചെക്ക്
        if (newPass !== confirmPass) {
            alert("New passwords do not match!");
            return false;
        }

        return true;
    }
</script>
{% endblock %}
