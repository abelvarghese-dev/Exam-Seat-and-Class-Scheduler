{% extends "base.html" %}
{% block content %}
<style>
    .edit-card {
        background: var(--card-bg); padding: 30px 40px; border-radius: 12px;
        border: 1px solid var(--border-light); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        max-width: 600px; margin: 40px auto;
    }
    .edit-header {
        display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border-light);
        padding-bottom: 15px; margin-bottom: 25px;
    }
    .edit-header h2 { margin: 0; color: #F59E0B; }
    
    .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
    .form-group input, .form-group select {
        padding: 12px; border: 1px solid var(--border-light); border-radius: 8px;
        background: var(--page-bg); color: var(--text-primary); font-size: 1rem;
        font-family: 'Inter', sans-serif; transition: 0.3s;
    }
    .form-group input:focus, .form-group select:focus {
        border-color: #F59E0B; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1); outline: none;
    }
    
    .btn-container { display: flex; gap: 15px; margin-top: 25px; }
    .btn-save {
        background: #F59E0B; color: black; padding: 12px 25px; border-radius: 8px;
        font-size: 1rem; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; flex: 1;
    }
    .btn-save:hover { background: #D97706; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.2); }
    
    .btn-cancel {
        background: var(--page-bg); color: var(--text-primary); padding: 12px 25px; border-radius: 8px;
        font-size: 1rem; font-weight: bold; text-decoration: none; text-align: center; border: 1px solid var(--border-light); transition: 0.3s; flex: 1;
    }
    .btn-cancel:hover { background: #E2E8F0; }
</style>

<div class="edit-card">
    <div class="edit-header">
        <i class="fas fa-edit" style="font-size: 2rem; color: #F59E0B;"></i>
        <h2>Edit Subject Details</h2>
    </div>

    <form method="POST" action="/edit/subject/{{ subject.id }}">
        
        <div class="form-group">
            <label>Subject Name</label>
            <input type="text" name="subject_name" value="{{ subject.subject_name }}" required>
        </div>
        
        <div class="form-group">
            <label>Subject Code</label>
            <input type="text" name="subject_code" value="{{ subject.subject_code }}" required>
        </div>

        <div class="form-group">
            <label>Department / Course</label>
            <select name="course_id" required>
                {% for c in courses %}
                    <option value="{{ c.id }}" {% if subject.course_id == c.id %}selected{% endif %}>{{ c.course_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Semester</label>
            <select name="semester" required>
                <option value="1" {% if subject.semester == 1 %}selected{% endif %}>Semester 1</option>
                <option value="2" {% if subject.semester == 2 %}selected{% endif %}>Semester 2</option>
                <option value="3" {% if subject.semester == 3 %}selected{% endif %}>Semester 3</option>
                <option value="4" {% if subject.semester == 4 %}selected{% endif %}>Semester 4</option>
                <option value="5" {% if subject.semester == 5 %}selected{% endif %}>Semester 5</option>
                <option value="6" {% if subject.semester == 6 %}selected{% endif %}>Semester 6</option>
                <option value="7" {% if subject.semester == 7 %}selected{% endif %}>Semester 7</option>
                <option value="8" {% if subject.semester == 8 %}selected{% endif %}>Semester 8</option>
            </select>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Changes</button>
            <a href="/manage/subjects" class="btn-cancel">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
