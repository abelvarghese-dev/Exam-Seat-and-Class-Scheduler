{% extends "base.html" %}

{% block content %}
<style>
    .pwd-container { 
        max-width: 450px; margin: 60px auto; background: #fff; 
        padding: 40px; border-radius: 20px; 
        box-shadow: 0 15px 35px rgba(0,0,0,0.07); border: 1px solid #f1f5f9; 
    }
    .pwd-header { text-align: center; margin-bottom: 30px; }
    .pwd-header i { font-size: 2.5rem; color: #6366f1; margin-bottom: 10px; }
    .pwd-header h2 { color: #1e293b; margin: 0; font-size: 1.5rem; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; }
    .form-control { 
        width: 100%; padding: 14px; border-radius: 12px; 
        border: 1.5px solid #e2e8f0; font-size: 1rem; box-sizing: border-box; transition: 0.3s;
    }
    .form-control:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    
    .btn-update { 
        width: 100%; background: #6366f1; color: white; border: none; 
        padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1rem; 
        cursor: pointer; transition: 0.3s; margin-top: 10px; 
    }
    .btn-update:hover { background: #4f46e5; transform: translateY(-1px); }
    
    .alert { padding: 14px; border-radius: 12px; text-align: center; margin-bottom: 25px; font-weight: 600; font-size: 0.9rem; }
    .alert-success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
</style>

<div class="pwd-container">
    <div class="pwd-header">
        <i class="fas fa-shield-alt"></i>
        <h2>Security Settings</h2>
        <p style="color: #64748b; font-size: 0.85rem;">Change your faculty account password</p>
    </div>

    {% if msg %}
        <div class="alert {% if msg_type == 'success' %}alert-success{% else %}alert-error{% endif %}">
            <i class="fas {% if msg_type == 'success' %}fa-check-circle{% else %}fa-exclamation-triangle{% endif %}" style="margin-right: 8px;"></i>
            {{ msg }}
        </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" class="form-control" placeholder="••••••••" required>
            <small style="color: #94a3b8; font-size: 0.75rem; margin-top: 5px; display: block;">Min. 6 chars, 1 Uppercase, 1 Number, 1 Symbol</small>
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-update">Update Password</button>
    </form>
</div>
{% endblock %}
