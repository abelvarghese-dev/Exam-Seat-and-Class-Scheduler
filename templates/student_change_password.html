{% extends "base.html" %}

{% block content %}
<style>
    .pwd-container { 
        max-width: 450px; margin: 60px auto; background: #fff; 
        padding: 40px; border-radius: 16px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .pwd-container h2 { text-align: center; color: #1e293b; margin-bottom: 30px; font-size: 1.5rem; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 600; color: #475569; margin-bottom: 8px; }
    .form-control { 
        width: 100%; padding: 12px 15px; border-radius: 10px; 
        border: 1px solid #cbd5e1; font-size: 1rem; box-sizing: border-box; transition: 0.3s;
    }
    .form-control:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1); }
    .btn-save { 
        width: 100%; background: #8b5cf6; color: white; border: none; 
        padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; 
        cursor: pointer; transition: 0.3s; margin-top: 10px; 
    }
    .btn-save:hover { background: #7c3aed; }
    
    .alert { padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: 600; font-size: 0.9rem; }
    .alert-success { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
</style>

<div class="pwd-container">
    <h2><i class="fas fa-lock" style="color: #8b5cf6; margin-right: 10px;"></i>Change Password</h2>

    {% if msg %}
        <div class="alert {% if msg_type == 'success' %}alert-success{% else %}alert-error{% endif %}">
            {{ msg }}
        </div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
        </div>
        <button type="submit" class="btn-save">Update Password</button>
    </form>
</div>
{% endblock %}
