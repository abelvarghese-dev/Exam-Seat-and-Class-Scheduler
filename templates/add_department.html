{% extends "base.html" %}
{% block content %}
<style>
    .add-card {
        background: var(--card-bg); padding: 30px 40px; border-radius: 12px;
        border: 1px solid var(--border-light); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        max-width: 500px; margin: 50px auto;
    }
    .add-header {
        display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--border-light);
        padding-bottom: 15px; margin-bottom: 25px;
    }
    .add-header h2 { margin: 0; color: #8B5CF6; }
    
    .form-group { display: flex; flex-direction: column; margin-bottom: 20px; }
    .form-group label { font-size: 0.95rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
    .form-group input {
        padding: 12px; border: 1px solid var(--border-light); border-radius: 8px;
        background: var(--page-bg); color: var(--text-primary); font-size: 1rem;
        font-family: 'Inter', sans-serif; transition: 0.3s;
    }
    .form-group input:focus {
        border-color: #8B5CF6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1); outline: none;
    }
    
    .btn-container { display: flex; gap: 15px; }
    .btn-save {
        background: #8B5CF6; color: white; padding: 12px 25px; border-radius: 8px;
        font-size: 1rem; font-weight: bold; border: none; cursor: pointer; transition: 0.3s; flex: 1;
    }
    .btn-save:hover { background: #7C3AED; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(139, 92, 246, 0.2); }
    
    .btn-cancel {
        background: var(--page-bg); color: var(--text-primary); padding: 12px 25px; border-radius: 8px;
        font-size: 1rem; font-weight: bold; text-decoration: none; text-align: center; border: 1px solid var(--border-light); transition: 0.3s; flex: 1;
    }
    .btn-cancel:hover { background: #E2E8F0; }
</style>

<div class="add-card">
    <div class="add-header">
        <i class="fas fa-building" style="font-size: 2rem; color: #8B5CF6;"></i>
        <h2>Add New Department</h2>
    </div>

    <form method="POST" action="/add_department">
        <div class="form-group">
            <label>Course / Department Name</label>
            <input type="text" name="new_course_name" placeholder="e.g. BSc Mathematics" required>
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-save"><i class="fas fa-save"></i> Save Department</button>
            <a href="/add_subject" class="btn-cancel">Back</a>
        </div>
    </form>
</div>
{% endblock %}
